services:
  sqlserver:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: deskhub-sqlserver

    environment:
      ACCEPT_EULA: "Y"
      MSSQL_PID: "Developer"
      MSSQL_SA_PASSWORD: "${DB_PASSWORD}"

    ports:
      - "${DB_PORT:-1433}:1433"

    volumes:
      - deskhub_sql_data:/var/opt/mssql

    restart: unless-stopped

volumes:
  deskhub_sql_data: